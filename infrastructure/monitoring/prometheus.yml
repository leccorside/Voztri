global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'voztri_backend'
    metrics_path: '/api/v1/health'
    static_configs:
      - targets: ['app:9000', 'nginx:80']

  - job_name: 'voztri_reverb'
    static_configs:
      - targets: ['reverb:8081']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
