<script>
  (function initOTP() {
    let currentCode = ['4', '8', '2', '9'];
    const maxDigits = 6;
    const cells = document.querySelectorAll('.otp-cell');
    const timerElem = document.getElementById('timer-display');
    const verifyBtn = document.getElementById('verify-btn');

    function renderCells() {
      cells.forEach((cell, idx) => {
        cell.className = 'otp-cell flex items-center justify-center h-14 rounded-2xl transition-all duration-200';
        cell.innerHTML = '';

        if (idx < currentCode.length) {
          cell.classList.add('bg-surface-container-lowest', 'shadow-sm');
          const span = document.createElement('span');
          span.className = 'font-headline-lg text-headline-lg font-bold text-on-surface';
          span.textContent = currentCode[idx];
          cell.appendChild(span);
        } else if (idx === currentCode.length) {
          cell.classList.add('bg-surface-container-lowest', 'shadow-md', 'shadow-primary/20');
          const cursor = document.createElement('span');
          cursor.className = 'w-0.5 h-6 bg-primary-container rounded-full animate-pulse';
          cell.appendChild(cursor);
        } else {
          cell.classList.add('bg-surface-container-low');
          const dot = document.createElement('span');
          dot.className = 'w-2 h-2 rounded-full bg-outline-variant/60';
          cell.appendChild(dot);
        }
      });

      if (currentCode.length === maxDigits) {
        verifyBtn.classList.remove('opacity-90');
        verifyBtn.classList.add('ring-2', 'ring-primary-container/40');
      } else {
        verifyBtn.classList.remove('ring-2', 'ring-primary-container/40');
      }
    }

    // Keypad interaction
    const keyButtons = document.querySelectorAll('.key-pad-btn');
    keyButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-val');
        if (currentCode.length < maxDigits && val !== null) {
          currentCode.push(val);
          renderCells();
          if (navigator.vibrate) navigator.vibrate(10);
        }
      });
    });

    // Backspace
    const backspaceBtn = document.getElementById('backspace-btn');
    if (backspaceBtn) {
      backspaceBtn.addEventListener('click', () => {
        if (currentCode.length > 0) {
          currentCode.pop();
          renderCells();
          if (navigator.vibrate) navigator.vibrate(15);
        }
      });
    }

    // Timer countdown
    let secondsLeft = 48;
    const interval = setInterval(() => {
      secondsLeft--;
      if (secondsLeft <= 0) {
        clearInterval(interval);
        if (timerElem) timerElem.textContent = '00:00';
      } else if (timerElem) {
        const s = secondsLeft < 10 ? '0' + secondsLeft : secondsLeft;
        timerElem.textContent = '00:' + s;
      }
    }, 1000);

    // Initial render
    renderCells();
  })();
</script></main></body></html>
